name: AMBIENTA — one-time extended artwork import
on:
  push:
    branches: ['feature/ambienta-icon-coverage-all-modules-2026-11-02']
    paths: ['.github/workflows/import-ambienta-icon-extension.yml']
permissions:
  contents: write
jobs:
  raster-import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: pip install Pillow==11.3.0 --disable-pip-version-check
      - name: Convert generated sprite into twelve dedicated WebP assets
        env:
          SHEET_SOURCE: 'https://dnznrvs05pmza.cloudfront.net/gemini/gemini-3.1-flash-image/images/1bc9f642-b6ef-4753-835b-30bbc8482b34/d24d13d1-21ee-4cf9-bf25-233e845d01e5/Create_a_precise_high_quality_UI_IMAGE_ASSET_SHEET_with_EXAC.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWMxYjYwNGMyYTJhZDBmYyIsImJ1Y2tldCI6InJ1bndheS10YXNrLWFydGlmYWN0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5Mzc4NjcwMH0.L0jRs9td2GkbOq6_H6txdRz6l2-BMDRiwuHngtvv4_Y'
        run: |
          python - <<'PY'
          import os, io, hashlib, urllib.request
          from pathlib import Path
          from PIL import Image, ImageOps
          req=urllib.request.Request(os.environ['SHEET_SOURCE'],headers={'User-Agent':'AMBIENTA-asset-build'})
          with urllib.request.urlopen(req,timeout=80) as f: payload=f.read()
          assert 30000<len(payload)<18000000
          im=Image.open(io.BytesIO(payload)).convert('RGB')
          assert im.width>=800 and im.height>=600,(im.width,im.height)
          im=ImageOps.fit(im,(2048,1536),method=Image.Resampling.LANCZOS)
          dest=Path('v3/overrides/src/assets/ai')
          dest.mkdir(exist_ok=True,parents=True)
          names=['vegetation','water','air','noise','measures','inspections','biodiversity','calendar','notice','review','export','industry']
          for i,name in enumerate(names):
              col,row=i%4,i//4
              source=im.crop((col*512+20,row*512+20,(col+1)*512-20,(row+1)*512-20))
              source.thumbnail((288,288),Image.Resampling.LANCZOS)
              path=dest/('icon-'+name+'.webp')
              source.save(path,'WEBP',quality=86,method=6)
              print(name,path.stat().st_size,hashlib.sha256(path.read_bytes()).hexdigest()[:16])
          PY
      - name: Commit V3 asset files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v3/overrides/src/assets/ai/
          git diff --cached --quiet || {
            git commit -m "assets(v3): twelve generated pictograms for missing semantic UI icons"
            git push origin "HEAD:feature/ambienta-icon-coverage-all-modules-2026-11-02"
          }
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-icon-coverage-art
          path: v3/overrides/src/assets/ai/icon-*.webp
          retention-days: 14
          if-no-files-found: warn
