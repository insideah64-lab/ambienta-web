name: Preparar AMBIENTA para GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: "ambienta-pages-content"
  cancel-in-progress: true
jobs:
  export-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener frontend público
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Compilar aplicación
        run: |
          npm ci --no-fund --no-audit
          npm run build
          # V2 is an independent static app under /v2/, keeping the stable V1 at /.
          mkdir -p web/assets
          cp assets/*.jpg web/assets/
          cd apps/web
          npm ci --no-fund --no-audit
          npm run build
          cd ../..
          mkdir -p dist/v2
          cp -a apps/web/dist/. dist/v2/
          # V3 is an independent build; never overwrite V1 or V2.
          sha256sum dist/index.html dist/v2/index.html > /tmp/ambienta-v1-v2-before.sha
          bash v3/scripts/build-v3.sh
          node --test tests/react-v3/*.test.mjs
          sha256sum -c /tmp/ambienta-v1-v2-before.sha
          touch dist/.nojekyll
      - name: Comprobar HTML, recursos y UTF-8
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("dist")
          for name in ("index.html","cloud.html"):
              text=(root/name).read_text(encoding="utf-8")
              assert "<!doctype html>" in text.lower(),name
              assert "<meta charset=" in text.lower(),name
              for bad in ("GESTIÃ","AutenticaciÃ","AMBIENTA Â·"):
                  assert bad not in text,(name,bad)
          assert list((root/"assets").glob("*.js"))
          assert list((root/"assets").glob("*.css"))
          assert (root/".nojekyll").exists()
          v2=(root/"v2"/"index.html").read_text(encoding="utf-8")
          assert '<div id="root"></div>' in v2
          assert list((root/"v2"/"assets").glob("*.js"))
          assert list((root/"v2"/"assets").glob("*.css"))
          v3=(root/"v3"/"index.html").read_text(encoding="utf-8")
          assert '<div id="root"></div>' in v3
          assert list((root/"v3"/"assets").glob("*.js"))
          assert list((root/"v3"/"assets").glob("*.css"))
          PY
      - name: Sincronizar la rama gh-pages con el sitio compilado
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy AMBIENTA ${GITHUB_SHA}"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push --force "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/gh-pages
