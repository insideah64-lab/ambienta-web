name: AMBIENTA V3 — diagnóstico WFS IGN acotado (sin publicar)
on:
  push:
    branches: ['feature/ambienta-v3-wfs-bbox-2026-10-31']
    paths: ['v3/ogc/**','.github/workflows/v3-wfs-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Consultar cuatro combinaciones de WFS sin bajar bases completas
        run: |
          node --check v3/ogc/probe-salta.mjs
          node v3/ogc/probe-salta.mjs
