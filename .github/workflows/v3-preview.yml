          if-no-files-found: warn
      - name: Capturas Conesa F3b · funciones no lineales documentadas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-curvas-f3b
          path: qa/ambienta-conesa-f3b/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas de Conesa F3a · indicadores y calidad ambiental
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-libro-f3a
          path: qa/ambienta-conesa-f3a/
