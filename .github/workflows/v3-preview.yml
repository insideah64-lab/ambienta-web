        with:
          name: ambienta-v366-document-identity-desktop
          path: qa/ambienta-v366-document-identity/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas del reporte de referencias V3.6.7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v367-reporte-referencias-desktop
          path: qa/ambienta-v367-issues/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas del informe técnico integral y versión imprimible
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v370-informe-integrado-desktop
          path: qa/ambienta-integral-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas de expedientes privados (sin sesión y sin datos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-private-project-intake
          path: qa/ambienta-private-intake/
          if-no-files-found: warn
          retention-days: 30
      - name: Capturas del anexo Conesa en el informe técnico
        if: always()
