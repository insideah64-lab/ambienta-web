name: AMBIENTA V3 — validación de versión pública (sin desplegar)
on:
  push:
    branches: ['feature/ambienta-v3-topologia-publicacion-2026-10-31', 'feature/ambienta-v32-areas-ensayo-2026-10-31', 'feature/ambienta-v33-zone-links-2026-10-31', 'feature/ambienta-v34-separacion-area-sig-2026-11-01', 'feature/ambienta-v35-analisis-puntos-zonas-2026-11-01']
    paths:
      - 'v3/**'
      - 'tests/react-v3/**'
      - '.github/workflows/v3-preview.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'v3/**'
      - 'tests/react-v3/**'
      - '.github/workflows/v3-preview.yml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v3-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build immutable V1 and V2 references
        run: |
          npm ci --no-audit --no-fund
          npm run build
          (cd apps/web && npm ci --no-audit --no-fund && npm run build)
          mkdir -p dist/v2
          cp -a apps/web/dist/. dist/v2/
          sha256sum dist/index.html dist/v2/index.html > /tmp/ambienta-v1-v2.sha
      - name: Stage V3, run geospatial regressions and verify V1/V2 integrity
        run: |
          bash v3/scripts/build-v3.sh
          node --test tests/react-v3/*.test.mjs
          sha256sum -c /tmp/ambienta-v1-v2.sha
          test -s dist/v3/index.html
      - name: Install Chromium
        working-directory: apps/web-v3
        timeout-minutes: 8
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1 --no-fund --no-audit
          npx playwright install chromium
      - name: Test V3 in a real browser
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 --directory dist >/tmp/ambienta-v3-preview.log 2>&1 &
          for i in $(seq 1 15); do curl -fsS http://127.0.0.1:8787/v3/index.html >/dev/null && break || sleep 1; done
          node apps/web-v3/scripts/topology-smoke.mjs
          node apps/web-v3/scripts/study-areas-smoke.mjs
          node apps/web-v3/scripts/perimeter-editor-smoke.mjs
          node apps/web-v3/scripts/diablillos-reference-qa-smoke.mjs
          node apps/web-v3/scripts/perimeter-legend-smoke.mjs
          node apps/web-v3/scripts/desktop-readability-smoke.mjs
          node apps/web-v3/scripts/work-priorities-smoke.mjs
          node apps/web-v3/scripts/compact-work-smoke.mjs
          node apps/web-v3/scripts/kpi-documentary-smoke.mjs
          node apps/web-v3/scripts/commitment-status-smoke.mjs
          node apps/web-v3/scripts/measure-trace-smoke.mjs
          node apps/web-v3/scripts/record-focus-smoke.mjs
          node apps/web-v3/scripts/spatial-links-smoke.mjs
          node apps/web-v3/scripts/area-gis-separation-smoke.mjs
          node apps/web-v3/scripts/point-zone-analysis-smoke.mjs
          node apps/web-v3/scripts/point-zone-imported-source-smoke.mjs
          node apps/web-v3/scripts/georef-real-smoke.mjs
          node apps/web-v3/scripts/sig-gateway-smoke.mjs
          sha256sum -c /tmp/ambienta-v1-v2.sha
      - name: Guardar capturas QA Diablillos (Área y SIG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-diablillos-v353-capturas
          path: qa/diablillos-v353/screenshots/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas de legibilidad web de escritorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v355-desktop-capturas
          path: qa/ambienta-v355-desktop/
          if-no-files-found: warn
          retention-days: 30
      - name: Capturas QA del trabajo priorizado en escritorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v356-prioridades-capturas
          path: qa/ambienta-v356-prioridades/
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar capturas desktop del bloque compacto V3.5.7
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v357-tarjetas-compactas
          path: qa/ambienta-v357-compact-work/
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar capturas de KPIs documentales V3.5.8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v358-kpi-desktop
          path: qa/ambienta-v358-kpi/
          if-no-files-found: warn
          retention-days: 30
      - name: Guardar capturas del seguimiento sin pseudoporcentajes V3.5.9
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v359-compromisos-desktop
          path: qa/ambienta-v359-commitments/
          retention-days: 30
          if-no-files-found: warn
      - name: Guardar capturas de trazabilidad documental V3.6.0
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v360-trazabilidad-capturas
          path: qa/ambienta-v360-trace/
          retention-days: 30
          if-no-files-found: warn
      - name: Guardar capturas de fichas individuales V3.6.1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v361-registros-desktop
          path: qa/ambienta-v361-records/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep QA build (not a deployment)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-v3-topology-preview
          path: |
            dist/v3/
            dist/v2/index.html
          retention-days: 14
