        with:
          name: ambienta-conesa-integral-report
          path: qa/ambienta-conesa-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas de AMBIENTA real según referencia visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-reference-dashboard-visual
          path: qa/ambienta-real-reference-design/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas de iconografía original AMBIENTA V3
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-original-icons-desktop
          path: qa/ambienta-original-icons/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas de paridad con la planilla didáctica de Leopold
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-leopold-excel-parity
          path: qa/ambienta-leopold-parity/
          if-no-files-found: warn
          retention-days: 30
      - name: Capturas de revisión Conesa simplificado y paridad Excel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-simplificado-parity
          path: qa/ambienta-conesa-simplificado/
          if-no-files-found: warn
          retention-days: 30
      - name: Capturas del motor Conesa 1997 libro F1
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-libro-f1
          path: qa/ambienta-conesa-libro-f1/
          if-no-files-found: warn
          retention-days: 30
      - name: Capturas Conesa Anejo 4 · fichas de atmósfera
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-anejo4-atmosfera
          path: qa/ambienta-conesa-anejo4-atmosfera/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas F3b · digitalización manual sobre imagen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-f3b-digitalizador-visual
          path: qa/ambienta-conesa-visual-f3b/
          retention-days: 30
          if-no-files-found: warn
      - name: Capturas F3b · auditoría y doble lectura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ambienta-conesa-auditoria-f3b
          path: qa/ambienta-conesa-auditoria-f3b/
